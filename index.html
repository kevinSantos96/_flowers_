<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti</title>
  <meta name="description" content="Haz clic en el girasol para ver una sorpresa especial de flores amarillas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Patrick+Hand&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: 'Patrick Hand', 'Comic Neue', cursive, sans-serif;
      user-select: none;
    }

    /* Partículas de polvo de estrellas dorado */
    .sparkles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Contenedor principal centrado */
    .interactive-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      outline: none;
      padding: 30px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .interactive-card:active {
      transform: scale(0.95);
    }

    /* Área del girasol y la mano */
    .flower-action-zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    /* Halo de luz cálida dorada */
    .glow-aura {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 175, 25, 0.55) 0%, rgba(255, 140, 0, 0.28) 45%, rgba(255, 120, 0, 0.08) 65%, rgba(0, 0, 0, 0) 75%);
      filter: blur(12px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* Contenedor del girasol SVG */
    .sunflower-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      z-index: 3;
      filter: drop-shadow(0 0 25px rgba(255, 185, 0, 0.65));
      animation: gentleFloat 4s ease-in-out infinite alternate, rotateSlightly 12s linear infinite;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease;
    }

    .interactive-card:hover .sunflower-wrapper {
      transform: scale(1.1) rotate(6deg);
      filter: drop-shadow(0 0 38px rgba(255, 205, 40, 0.95));
    }

    @keyframes gentleFloat {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-8px);
      }
    }

    @keyframes rotateSlightly {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .sunflower-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Texto "Flores Amarillas para Ti" */
    .caption-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffe072;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
      transition: color 0.4s ease, transform 0.4s ease, text-shadow 0.4s ease, opacity 0.8s ease;
      white-space: nowrap;
    }

    .interactive-card:hover .caption-title {
      color: #fff2a6;
      transform: scale(1.04);
      text-shadow: 0 0 22px rgba(255, 230, 80, 0.8), 0 0 35px rgba(255, 180, 0, 0.5);
    }

    /* Animación de floración cinematográfica al hacer clic */
    .interactive-card.blooming .sunflower-wrapper {
      transform: scale(1.4) rotate(25deg);
      filter: drop-shadow(0 0 65px rgba(255, 225, 70, 1)) brightness(1.2);
      transition: transform 1.8s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1.8s ease-out;
    }

    .interactive-card.blooming .glow-aura {
      transform: scale(3.2);
      opacity: 1;
      filter: blur(25px);
      transition: transform 1.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 1.5s ease-out, filter 1.8s ease-out;
    }

    .interactive-card.blooming .caption-title {
      opacity: 0;
      transform: translateY(18px) scale(0.95);
      transition: opacity 0.9s ease-out, transform 0.9s ease-out;
    }

    /* Transición suave, lenta y mágica de pantalla completa */
    .transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(255, 230, 110, 0.96) 0%, rgba(255, 180, 20, 0.92) 42%, rgba(12, 6, 2, 0.98) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 1.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .transition-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .sunflower-wrapper {
        width: 140px;
        height: 140px;
      }
      .glow-aura {
        width: 220px;
        height: 220px;
      }
      .caption-title {
        font-size: 1.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Lienzo de chispitas doradas flotantes -->
  <canvas class="sparkles-canvas" id="sparklesCanvas"></canvas>

  <!-- Overlay para transición suave dorada al hacer clic -->
  <div class="transition-overlay" id="transitionOverlay"></div>

  <!-- Tarjeta interactiva con enlace a flores.html -->
  <a href="flores.html" class="interactive-card" id="cardButton" aria-label="Ver flores amarillas para ti">
    <div class="flower-action-zone">
      <!-- Halo resplandeciente dorado -->
      <div class="glow-aura"></div>

      <!-- Girasol Radiante Vectorial -->
      <div class="sunflower-wrapper">
        <svg class="sunflower-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Degradado para los pétalos exteriores (dorados vibrantes) -->
            <linearGradient id="outerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#ff8c00" />
              <stop offset="40%" stop-color="#ffb703" />
              <stop offset="85%" stop-color="#ffea00" />
              <stop offset="100%" stop-color="#fff575" />
            </linearGradient>

            <!-- Degradado para los pétalos interiores -->
            <linearGradient id="innerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#e85d04" />
              <stop offset="35%" stop-color="#f48c06" />
              <stop offset="80%" stop-color="#ffd000" />
              <stop offset="100%" stop-color="#fffa8a" />
            </linearGradient>

            <!-- Degradado para el centro del girasol -->
            <radialGradient id="sunflowerCoreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#2a1205" />
              <stop offset="55%" stop-color="#3d1e08" />
              <stop offset="80%" stop-color="#5a2d0c" />
              <stop offset="92%" stop-color="#804313" />
              <stop offset="100%" stop-color="#3a1a06" />
            </radialGradient>

            <!-- Textura de semillas en corona -->
            <radialGradient id="seedRingGrad" cx="50%" cy="50%" r="50%">
              <stop offset="60%" stop-color="transparent" />
              <stop offset="78%" stop-color="#995217" />
              <stop offset="88%" stop-color="#4d2407" />
              <stop offset="100%" stop-color="#220e03" />
            </radialGradient>

            <!-- Molde básico de un pétalo elegante -->
            <path id="petalShape" d="M 0 0 C -12 -35 -16 -85 0 -115 C 16 -85 12 -35 0 0 Z" />
            <path id="innerPetalShape" d="M 0 0 C -10 -30 -13 -75 0 -100 C 13 -75 10 -30 0 0 Z" />
          </defs>

          <!-- Capa 1: Pétalos Exteriores (24 pétalos distribuidos equitativamente) -->
          <g transform="translate(150, 150)">
            <g id="outerPetalsGroup">
              <!-- 24 pétalos a 15 grados de separación -->
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(0)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(15)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(30)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(45)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(60)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(75)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(90)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(105)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(120)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(135)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(150)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(165)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(180)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(195)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(210)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(225)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(240)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(255)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(270)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(285)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(300)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(315)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(330)" />
              <use href="#petalShape" fill="url(#outerPetalGrad)" transform="rotate(345)" />
            </g>

            <!-- Capa 2: Pétalos Interiores intercalados (desfasados 7.5 grados) -->
            <g id="innerPetalsGroup">
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(7.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(22.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(37.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(52.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(67.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(82.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(97.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(112.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(127.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(142.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(157.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(172.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(187.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(202.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(217.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(232.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(247.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(262.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(277.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(292.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(307.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(322.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(337.5)" />
              <use href="#innerPetalShape" fill="url(#innerPetalGrad)" transform="rotate(352.5)" />
            </g>

            <!-- Capa 3: Corona y Centro oscuro de semillas -->
            <circle cx="0" cy="0" r="48" fill="url(#sunflowerCoreGrad)" />
            <circle cx="0" cy="0" r="48" fill="url(#seedRingGrad)" />

            <!-- Punteado concéntrico simulando espiral floral natural -->
            <g fill="#deb887" opacity="0.38">
              <circle cx="0" cy="-36" r="1.8" /><circle cx="12" cy="-34" r="1.8" /><circle cx="23" cy="-28" r="1.8" />
              <circle cx="31" cy="-18" r="1.8" /><circle cx="36" cy="-6" r="1.8" /><circle cx="35" cy="8" r="1.8" />
              <circle cx="29" cy="21" r="1.8" /><circle cx="18" cy="31" r="1.8" /><circle cx="5" cy="36" r="1.8" />
              <circle cx="-9" cy="35" r="1.8" /><circle cx="-22" cy="29" r="1.8" /><circle cx="-32" cy="18" r="1.8" />
              <circle cx="-36" cy="4" r="1.8" /><circle cx="-34" cy="-11" r="1.8" /><circle cx="-26" cy="-25" r="1.8" />
              <circle cx="-14" cy="-33" r="1.8" />

              <circle cx="0" cy="-24" r="1.6" /><circle cx="14" cy="-20" r="1.6" /><circle cx="23" cy="-8" r="1.6" />
              <circle cx="22" cy="10" r="1.6" /><circle cx="12" cy="21" r="1.6" /><circle cx="-4" cy="24" r="1.6" />
              <circle cx="-18" cy="16" r="1.6" /><circle cx="-24" cy="2" r="1.6" /><circle cx="-18" cy="-16" r="1.6" />

              <circle cx="0" cy="-12" r="1.4" /><circle cx="9" cy="-8" r="1.4" /><circle cx="12" cy="3" r="1.4" />
              <circle cx="5" cy="11" r="1.4" /><circle cx="-6" cy="10" r="1.4" /><circle cx="-12" cy="-2" r="1.4" />
              <circle cx="-4" cy="-11" r="1.4" /><circle cx="0" cy="0" r="2.2" fill="#ffd700" opacity="0.6" />
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- Título idéntico a la imagen de referencia -->
    <h1 class="caption-title">Flores Amarillas para Ti</h1>
  </a>

  <script>
    // Sistema de partículas de brillo dorado en el fondo
    const canvas = document.getElementById('sparklesCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const PARTICLE_COUNT = 45;

    class SparkleParticle {
      constructor() {
        this.reset(true);
      }

      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : height + 10;
        this.size = Math.random() * 2.2 + 0.6;
        this.speedY = Math.random() * 0.4 + 0.15;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.alpha = 0;
        this.targetAlpha = Math.random() * 0.7 + 0.2;
        this.fadeSpeed = 0.008 + Math.random() * 0.012;
        this.fadingIn = true;
        this.color = Math.random() > 0.4 ? '255, 215, 0' : '255, 240, 160';
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;

        if (this.fadingIn) {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= this.targetAlpha) {
            this.alpha = this.targetAlpha;
            this.fadingIn = false;
          }
        } else {
          this.alpha -= this.fadeSpeed * 0.7;
          if (this.alpha <= 0) {
            this.reset();
          }
        }

        if (this.y < -10 || this.x < -10 || this.x > width + 10) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${this.color}, 0.8)`;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new SparkleParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Efecto de sonido suave y transición cinematográfica pausada
    const cardButton = document.getElementById('cardButton');
    const overlay = document.getElementById('transitionOverlay');
    let isTransitioning = false;

    // Reproduce un suave arpegio luminoso
    function playChimeSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audioCtx = new AudioContext();

        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.14);

          gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.14);
          gain.gain.linearRampToValueAtTime(0.09, audioCtx.currentTime + index * 0.14 + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + index * 0.14 + 1.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + index * 0.14);
          osc.stop(audioCtx.currentTime + index * 0.14 + 1.7);
        });
      } catch (e) {
        // En caso de que el navegador bloquee audio automático
      }
    }

    cardButton.addEventListener('click', (e) => {
      e.preventDefault();
      if (isTransitioning) return;
      isTransitioning = true;

      // Efecto de floración gradual en el girasol
      cardButton.classList.add('blooming');
      playChimeSound();

      // Velo dorado suave y lento
      overlay.classList.add('active');

      // Animación pausada de 1.8 segundos para un cambio mágico y relajado
      setTimeout(() => {
        window.location.href = 'flores.html';
      }, 1800);
    });
  </script>
</body>
</html>
